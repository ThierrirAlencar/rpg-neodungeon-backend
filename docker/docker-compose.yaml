name: neod-services

services:
  pg-db:
    image: postgres:18
    container_name: neod_pg-db
    environment:
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD}
      POSTGRES_DB: ${PG_DB_NAME}
    ports:
      - "${PG_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql  
    restart: unless-stopped
  
  bucket-service:
    image: minio/minio
    container_name: neod_bucket-service
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    command: server /data
    restart: unless-stopped
  
  cache-service:
    image: redis
    container_name: neod_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  
